<section>

    <h2>Mis tareas</h2>

    <p>Total: {{ totalTasks() }}</p>

    <p>Completadas: {{ completedTasks() }}</p>

    <p>Pendientes: {{ pendingTasks() }}</p>

    <ul>

        @for (task of tasks(); track task.id) {

            <li>

                <input
                    type="checkbox"
                    [checked]="task.completed"
                    (change)="toggleTask(task.id)"
                >

                {{ task.title }}

            </li>

        }

    </ul>

</section>
